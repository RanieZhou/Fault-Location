<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | 配网故障定位系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      width: 360px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 32px 28px;
    }
    .login-logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    .login-title { text-align: center; font-size: 17px; font-weight: 700; color: var(--text-primary); }
    .login-sub { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 4px; margin-bottom: 26px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .login-error {
      display: none;
      font-size: 12px; color: var(--red);
      background: var(--red-dim); border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 14px;
    }
    .login-submit { width: 100%; margin-top: 6px; }
  </style>
</head>
<body>

  <form class="login-card" id="login-form">
    <div class="login-logo-icon"><i class="bi bi-grid-3x3-gap-fill" style="color:#fff;font-size:20px"></i></div>
    <div class="login-title">配网故障定位系统</div>
    <div class="login-sub">10kV Distribution Fault Intelligence</div>

    <div class="login-error" id="login-error"></div>

    <div class="login-field">
      <label for="login-username">用户名</label>
      <input class="input" type="text" id="login-username" autocomplete="username" autofocus required>
    </div>
    <div class="login-field">
      <label for="login-password">密码</label>
      <input class="input" type="password" id="login-password" autocomplete="current-password" required>
    </div>

    <button class="btn btn-primary login-submit" type="submit" id="login-submit-btn">登录</button>
  </form>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-username').value,
            password: document.getElementById('login-password').value,
          }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          window.location.href = '/';
        } else {
          errEl.textContent = data.message || '登录失败';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = '请求失败：' + err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>

</body>
</html>
